<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Nahom.ai</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-alt: #162032;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --accent-gradient: linear-gradient(135deg, #38bdf8, #6366f1);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(51, 65, 85, 0.5);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Login Screen */
        .login-card {
            max-width: 420px;
            margin: 60px auto;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(12px);
            text-align: center;
        }

        .login-card h2 {
            font-size: 1.6rem;
            margin-bottom: 25px;
            font-family: 'Syne', sans-serif;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus, input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        button.btn-primary {
            width: 100%;
            padding: 12px 20px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
            transition: all 0.3s ease;
        }

        button.btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
        }

        /* Panel layout */
        .admin-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(12px);
        }

        /* Stats strip */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }

        .stat-val {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.2;
            margin-bottom: 5px;
            font-family: 'Syne', sans-serif;
        }

        .stat-lbl {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tabs */
        .tabs-header {
            display: flex;
            gap: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 600;
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: white;
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Alert / Message banner */
        .status-banner {
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 500;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.95rem;
            display: none;
        }

        .status-banner.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
            display: block;
        }

        .status-banner.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            display: block;
        }

        /* Tables */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background-color: var(--bg-alt);
            color: var(--text-primary);
            font-weight: 600;
            padding: 16px;
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-secondary);
            vertical-align: top;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
        }

        /* Row tags / buttons */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 50px;
        }

        .status-badge.approved {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-badge.pending {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .action-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: none;
            padding: 6px 12px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
        }

        .action-btn.approve {
            background: var(--success);
        }

        .action-btn.approve:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .action-btn.unapprove {
            background: var(--warning);
        }

        .action-btn.unapprove:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        .action-btn.delete {
            background: var(--danger);
        }

        .action-btn.delete:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }

        .action-btn.archive {
            background: #475569;
        }

        .action-btn.archive:hover {
            background: #334155;
        }

        .action-btn.unarchive {
            background: #8b5cf6;
        }

        .action-btn.unarchive:hover {
            background: #7c3aed;
        }

        .nav-back {
            display: inline-block;
            margin-top: 25px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .nav-back:hover {
            color: var(--accent-hover);
            transform: translateX(-3px);
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }
            .admin-panel {
                padding: 15px;
            }
            th, td {
                padding: 10px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Nahom Dashboard</h1>
            <p>Portfolio Admin Portal</p>
        </header>

        <!-- Login Form -->
        <div id="loginForm" class="login-card">
            <h2>🔑 System Authentication</h2>
            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" id="password" placeholder="Enter admin password..." onkeydown="if(event.key==='Enter') login()">
            </div>
            <button onclick="login()" class="btn-primary">Unlock Panel</button>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="admin-panel" style="display:none;">
            <!-- Stats overview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="statTotalMessages" class="stat-val">0</div>
                    <div class="stat-lbl">Total Messages</div>
                </div>
                <div class="stat-card">
                    <div id="statTotalComments" class="stat-val">0</div>
                    <div class="stat-lbl">Total Comments</div>
                </div>
                <div class="stat-card">
                    <div id="statPendingComments" class="stat-val" style="color: var(--warning);">0</div>
                    <div class="stat-lbl">Pending Comments</div>
                </div>
            </div>

            <!-- Tab Headers -->
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('messages')" id="tabMessages">Messages</button>
                <button class="tab-btn" onclick="switchTab('comments')" id="tabComments">Comments</button>
            </div>

            <!-- Alert banner -->
            <div id="messageBanner" class="status-banner"></div>

            <!-- Messages Table -->
            <div id="messagesTableContainer" style="display:block;">
                <div class="table-responsive">
                    <table id="messagesTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Message</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Comments Table -->
            <div id="commentsTableContainer" style="display:none;">
                <div class="table-responsive">
                    <table id="commentsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Comment</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <a href="/" class="nav-back">← Back to Portfolio Website</a>
        </div>
    </div>

    <script>
        let currentPassword = '';
        let currentTab = 'messages';
        let stats = {
            totalMsgs: 0,
            totalCmts: 0,
            pendingCmts: 0
        };

        function login() {
            const pwdInput = document.getElementById('password');
            currentPassword = pwdInput.value;
            if (!currentPassword) {
                alert('Please enter password');
                return;
            }
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadData();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabMessages').classList.remove('active');
            document.getElementById('tabComments').classList.remove('active');
            document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('active');
            
            if (tab === 'messages') {
                document.getElementById('messagesTableContainer').style.display = 'block';
                document.getElementById('commentsTableContainer').style.display = 'none';
            } else {
                document.getElementById('messagesTableContainer').style.display = 'none';
                document.getElementById('commentsTableContainer').style.display = 'block';
            }
        }

        function showBanner(text, type = 'success') {
            const banner = document.getElementById('messageBanner');
            banner.textContent = text;
            banner.className = `status-banner ${type}`;
            setTimeout(() => {
                banner.style.display = 'none';
            }, 5000);
        }

        async function loadData() {
            // Load messages and comments in parallel to calculate stats
            await Promise.all([loadMessages(), loadComments()]);
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById('statTotalMessages').textContent = stats.totalMsgs;
            document.getElementById('statTotalComments').textContent = stats.totalCmts;
            document.getElementById('statPendingComments').textContent = stats.pendingCmts;
        }

        async function loadMessages() {
            const url = `/api/messages?password=${encodeURIComponent(currentPassword)}&includeArchived=true`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.success) {
                    stats.totalMsgs = data.data.length;
                    displayMessages(data.data);
                } else {
                    showBanner('Failed to load messages. Verify password.', 'error');
                }
            } catch (error) {
                showBanner('Error loading messages. Server is offline.', 'error');
            }
        }

        function displayMessages(messages) {
            const tbody = document.querySelector('#messagesTable tbody');
            tbody.innerHTML = '';
            if (messages.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-secondary);">No messages found.</td></tr>';
                return;
            }
            messages.forEach(msg => {
                const row = tbody.insertRow();
                if (msg.archived) {
                    row.style.opacity = '0.5';
                }
                const date = new Date(msg.date).toLocaleString(undefined, { 
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                });
                
                row.insertCell(0).textContent = date;
                row.insertCell(1).textContent = msg.name;
                
                const emailCell = row.insertCell(2);
                const emailLink = document.createElement('a');
                emailLink.href = `mailto:${msg.email}`;
                emailLink.style.color = 'var(--accent)';
                emailLink.textContent = msg.email;
                emailCell.appendChild(emailLink);
                
                row.insertCell(3).textContent = msg.message;
                
                const actionsCell = row.insertCell(4);
                actionsCell.className = 'action-group';
                
                const archiveBtn = document.createElement('button');
                archiveBtn.textContent = msg.archived ? 'Unarchive' : 'Archive';
                archiveBtn.className = msg.archived ? 'action-btn unarchive' : 'action-btn archive';
                archiveBtn.onclick = () => toggleArchive(msg._id);
                actionsCell.appendChild(archiveBtn);
            });
        }

        async function toggleArchive(id) {
            const url = `/api/messages/${id}/archive?password=${encodeURIComponent(currentPassword)}`;
            try {
                const response = await fetch(url, { method: 'PATCH' });
                const data = await response.json();
                if (data.success) {
                    showBanner('Message archived status toggled successfully.');
                    loadData();
                } else {
                    alert('Failed to update message.');
                }
            } catch (error) {
                alert('Connection error.');
            }
        }

        async function loadComments() {
            const url = `/api/comments/all?password=${encodeURIComponent(currentPassword)}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.success) {
                    stats.totalCmts = data.data.length;
                    stats.pendingCmts = data.data.filter(c => !c.approved).length;
                    displayComments(data.data);
                } else {
                    showBanner('Failed to load comments. Verify password.', 'error');
                }
            } catch (error) {
                showBanner('Error loading comments. Server is offline.', 'error');
            }
        }

        function displayComments(comments) {
            const tbody = document.querySelector('#commentsTable tbody');
            tbody.innerHTML = '';
            if (comments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-secondary);">No comments found.</td></tr>';
                return;
            }
            comments.forEach(cmt => {
                const row = tbody.insertRow();
                const date = new Date(cmt.date).toLocaleString(undefined, { 
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                });
                
                row.insertCell(0).textContent = date;
                row.insertCell(1).textContent = cmt.name;
                row.insertCell(2).textContent = cmt.email;
                row.insertCell(3).textContent = cmt.comment;
                
                const statusCell = row.insertCell(4);
                const statusBadge = document.createElement('span');
                statusBadge.className = cmt.approved ? 'status-badge approved' : 'status-badge pending';
                statusBadge.textContent = cmt.approved ? 'Approved' : 'Pending';
                statusCell.appendChild(statusBadge);
                
                const actionsCell = row.insertCell(5);
                actionsCell.className = 'action-group';
                
                // Approve/Unapprove
                const approveBtn = document.createElement('button');
                approveBtn.textContent = cmt.approved ? 'Unapprove' : 'Approve';
                approveBtn.className = cmt.approved ? 'action-btn unapprove' : 'action-btn approve';
                approveBtn.onclick = () => toggleApprove(cmt._id);
                actionsCell.appendChild(approveBtn);
                
                // Delete
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.className = 'action-btn delete';
                deleteBtn.onclick = () => deleteComment(cmt._id);
                actionsCell.appendChild(deleteBtn);
            });
        }

        async function toggleApprove(id) {
            const url = `/api/comments/${id}/approve?password=${encodeURIComponent(currentPassword)}`;
            try {
                const response = await fetch(url, { method: 'PATCH' });
                const data = await response.json();
                if (data.success) {
                    showBanner('Comment approval status updated.');
                    loadData();
                } else {
                    alert('Failed to update comment.');
                }
            } catch (error) {
                alert('Connection error.');
            }
        }

        async function deleteComment(id) {
            if (!confirm('Are you sure you want to permanently delete this comment?')) return;
            const url = `/api/comments/${id}?password=${encodeURIComponent(currentPassword)}`;
            try {
                const response = await fetch(url, { method: 'DELETE' });
                const data = await response.json();
                if (data.success) {
                    showBanner('Comment deleted permanently.');
                    loadData();
                } else {
                    alert('Failed to delete comment.');
                }
            } catch (error) {
                alert('Connection error.');
            }
        }
    </script>
</body>
</html>
